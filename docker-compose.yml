# Article Platform — deploy as-is on any Docker platform
# (Coolify, Dokploy, Portainer, CapRover, Komodo, or plain `docker compose up -d`).
#
# Works with ZERO environment variables. On first boot the app generates its
# own encryption key and admin password into the data volume, so there is
# nothing to create over SSH.
#
# The admin password is printed in the container logs on startup. Look for
# "ADMIN PASSWORD". To choose your own instead, set AUTH_PASSWORD below.

services:
  platform:
    build: .
    # Prefer a prebuilt image if your platform pulls rather than builds:
    #   image: ghcr.io/YOUR_USERNAME/article-platform:latest
    container_name: article-platform
    restart: unless-stopped

    ports:
      # Your platform's reverse proxy terminates TLS and forwards here.
      # Safe to expose because the UI requires a password.
      - "8080:8080"

    environment:
      DB_PATH: /app/data/platform.db
      # ---- All optional. Delete any line to accept the default. ----
      # AUTH_PASSWORD: choose-your-own-password
      # ENCRYPTION_KEY: 64-hex-chars   # generated into the volume if unset
      # LOG_LEVEL: info

    volumes:
      # Everything that must survive a redeploy: database, encryption key,
      # admin password. Losing this volume means re-entering all credentials.
      - platform-data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  platform-data:
