# Local development / testing on your own machine.
#   docker compose -f docker-compose.local.yml up -d --build
#
# Differences from the deployment file: binds to localhost only, uses a bind
# mount so you can inspect the database, and mounts prompts read-write so you
# can edit them without rebuilding.

services:
  platform:
    build: .
    container_name: article-platform-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_PATH: /app/data/platform.db
      LOG_LEVEL: debug
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts
